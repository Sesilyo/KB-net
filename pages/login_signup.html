<!-- FILENAME: login_signup.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KB-Net</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/stylings/login_signup.css" />
</head>
<body>

<div class="page">

  <!-- ── Brand Panel ── -->
  <div class="panel-brand">
    <div class="brand-logo">
      <h1>KB-Net</h1>
      <p><strong>Kuha-Balik · Network</strong></p>
      <p>A Borrowing System for the Student Body</p>
    </div>
    <div class="brand-deco" aria-hidden="true"></div>
  </div>

  <!-- ── Form Panel ── -->
  <div class="panel-form">

    <!-- Tab switcher -->
    <div class="tab-bar">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      <div class="tab-indicator" id="tab-indicator"></div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-card" id="form-login">
      <h2>Enter Account</h2>

      <div class="field">
        <input type="email" placeholder="Email" autocomplete="email" />
      </div>
      <div class="field">
        <input type="password" placeholder="Password" autocomplete="current-password" />
      </div>

      <div class="btn-row">
        <button class="btn-signup" onclick="switchTab('signup')">Sign Up</button>
        <button class="btn-login">Log In</button>
      </div>

      <p class="switch">Don't have an account? <button class="link-btn" onclick="switchTab('signup')">Sign Up</button></p>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-card hidden" id="form-signup">
      <h2>Create an Account</h2>

      <div class="field-row">
        <div class="field"><input type="text" placeholder="First Name" autocomplete="given-name" /></div>
        <div class="field"><input type="text" placeholder="Last Name" autocomplete="family-name" /></div>
      </div>

      <div class="field">
        <input type="text" placeholder="Student ID" />
      </div>
      <div class="field">
        <input type="email" placeholder="Email" autocomplete="email" />
      </div>
      <div class="field">
        <input type="password" placeholder="Password" autocomplete="new-password" />
      </div>

      <button class="btn-primary">Sign Up</button>
      <p class="switch"> Already have an account? <button class="link-btn" onclick="switchTab('login')">Log In</button></p>
      
    </div>
        
  </div>
</div>

<script>
  function switchTab(tab) {
    const loginForm   = document.getElementById('form-login');
    const signupForm  = document.getElementById('form-signup');
    const tabLogin    = document.getElementById('tab-login');
    const tabSignup   = document.getElementById('tab-signup');
    const indicator   = document.getElementById('tab-indicator');

    if (tab === 'login') {
      loginForm.classList.remove('hidden');
      loginForm.classList.add('visible');
      signupForm.classList.add('hidden');
      signupForm.classList.remove('visible');
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      indicator.style.transform = 'translateX(0)';
    } else {
      signupForm.classList.remove('hidden');
      signupForm.classList.add('visible');
      loginForm.classList.add('hidden');
      loginForm.classList.remove('visible');
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      indicator.style.transform = 'translateX(100%)';
    }
  }
</script>

</body>
</html>
